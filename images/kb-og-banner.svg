<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A050F" />
      <stop offset="40%" stop-color="#720E1E" />
      <stop offset="100%" stop-color="#2D0209" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA771C" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#720E1E" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background with Vignette -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <circle cx="600" cy="280" r="450" fill="url(#glow)" />

  <!-- Regal Decorative Outer Borders -->
  <rect x="30" y="30" width="1140" height="570" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.6" rx="8" />
  <rect x="42" y="42" width="1116" height="546" fill="none" stroke="#D4AF37" stroke-width="1" stroke-dasharray="6,6" opacity="0.4" rx="6" />

  <!-- Corner Flourishes -->
  <g fill="url(#goldGrad)" opacity="0.75">
    <circle cx="50" cy="50" r="5" />
    <circle cx="1150" cy="50" r="5" />
    <circle cx="50" cy="580" r="5" />
    <circle cx="1150" cy="580" r="5" />
  </g>

  <!-- Central Crest Emblem -->
  <g transform="translate(600, 160)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="65" fill="#2D0209" stroke="url(#goldGrad)" stroke-width="3" />
    <circle cx="0" cy="0" r="56" fill="none" stroke="#D4AF37" stroke-width="1" stroke-dasharray="4,4" opacity="0.6" />
    <text x="0" y="16" font-family="'Playfair Display', Georgia, serif" font-size="44" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="2">KB</text>
  </g>

  <!-- Brand Typography -->
  <!-- ESTD Badge -->
  <g transform="translate(600, 260)">
    <rect x="-110" y="-14" width="220" height="28" rx="14" fill="#000000" opacity="0.3" />
    <text x="0" y="5" font-family="'Outfit', -apple-system, sans-serif" font-size="14" font-weight="700" fill="#FFE082" text-anchor="middle" letter-spacing="4">HYDERABAD • EST. 1953</text>
  </g>

  <!-- Main Headline -->
  <text x="600" y="340" font-family="'Playfair Display', Georgia, serif" font-size="64" font-weight="800" fill="#FFFDF9" text-anchor="middle" letter-spacing="1" filter="url(#shadow)">
    Karachi Bakery
  </text>

  <!-- Subheadline -->
  <text x="600" y="390" font-family="'Outfit', -apple-system, sans-serif" font-size="22" font-weight="400" fill="#FFCDD2" text-anchor="middle" letter-spacing="1.5">
    The Royal Taste of Hyderabad • Handcrafted Heritage Since 1953
  </text>

  <!-- Signature Delicacy Highlights -->
  <g transform="translate(600, 460)">
    <!-- Pill 1 -->
    <g transform="translate(-360, 0)">
      <rect x="-100" y="-20" width="200" height="40" rx="20" fill="rgba(255,255,255,0.08)" stroke="url(#goldGrad)" stroke-width="1.5" />
      <text x="0" y="6" font-family="'Outfit', sans-serif" font-size="15" font-weight="600" fill="#FFF" text-anchor="middle">🍪 Iconic Fruit Biscuits</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(-120, 0)">
      <rect x="-100" y="-20" width="200" height="40" rx="20" fill="rgba(255,255,255,0.08)" stroke="url(#goldGrad)" stroke-width="1.5" />
      <text x="0" y="6" font-family="'Outfit', sans-serif" font-size="15" font-weight="600" fill="#FFF" text-anchor="middle">☕ Royal Osmania Biscuits</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(120, 0)">
      <rect x="-100" y="-20" width="200" height="40" rx="20" fill="rgba(255,255,255,0.08)" stroke="url(#goldGrad)" stroke-width="1.5" />
      <text x="0" y="6" font-family="'Outfit', sans-serif" font-size="15" font-weight="600" fill="#FFF" text-anchor="middle">🎂 Artisan Custom Cakes</text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(360, 0)">
      <rect x="-100" y="-20" width="200" height="40" rx="20" fill="rgba(255,255,255,0.08)" stroke="url(#goldGrad)" stroke-width="1.5" />
      <text x="0" y="6" font-family="'Outfit', sans-serif" font-size="15" font-weight="600" fill="#FFF" text-anchor="middle">🎁 Keepsake Hampers</text>
    </g>
  </g>

  <!-- Bottom Delivery Footer Banner -->
  <g transform="translate(600, 545)">
    <text x="0" y="0" font-family="'Outfit', sans-serif" font-size="15" font-weight="600" fill="#FFE082" text-anchor="middle" letter-spacing="1">
      ⚡ 2-Hour Express Delivery in Hyderabad &amp; Nationwide Air Cargo to 19,000+ Pincodes
    </text>
  </g>
</svg>
